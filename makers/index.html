---
title: Makers
permalink: /makers/
---
<h1>Makers</h1>
<ul class="count-list wide">
  {% assign makers = site.makers | sort: "title" %}
  {% for m in makers %}
  {% assign n = site.tools | where: "maker", m.slug | size %}
  {% if n == 0 %}{% continue %}{% endif %}
  <li><a href="{{ m.url | relative_url }}">{{ m.title }}</a><span class="muted desc">{{ m.location }}</span><span>{{ n }}</span></li>
  {% endfor %}
</ul>
