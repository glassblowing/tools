- id: cmog-shops
  name: Shops at the Corning Museum of Glass
  url: https://shops.cmog.org/
  crawl: []
  scope:
    in: Buy links for tools already in the archive (Jim Moore Glass Tools in particular).
  notes: >-
    Sits behind Cloudflare. scripts/archive.py (browser User-Agent) gets real pages, but
    plain curl, WebFetch, and headless Chrome get a 403 challenge. Never remove a link
    just for a 403 here; retry with the script or ask a human to check in a browser.

- id: glass-color
  name: Glass Color
  url: https://glasscolor.com/
