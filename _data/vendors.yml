# Every shop the archive links to. A tool's `buy[].vendor` must match a `name` here.
#
#   id        stable slug
#   name      display name, used in buy links
#   url       storefront home page
#   maker     _makers slug when this is the maker selling its own tools (shown as "direct from the maker")
#   platform  shopify | woocommerce | squarespace lets scripts/archive.py read catalogs as JSON;
#             leave it out and the crawl pages are read directly
#   crawl     catalog pages to scan for new in-scope tools; empty means only re-check existing links
#   scope     what to index from this vendor (in / out). Out-of-scope items are skipped, not listed.
#   photos    "no" if the vendor has asked us not to show its product photos. Otherwise
#             `archive.py photos` links listings to the vendor's own image URLs (hotlinked,
#             never copied) with a credit line. After setting "no", clear that vendor's
#             images: remove image/image_credit/image_source where image_credit is its name.
#   location  for shops (vendors without a maker): "Town, Region, Country" from the shop's own site.
#             `archive.py geocode --write` adds town-level coords for the Makers & Shops map.
#   notes     anything the next update needs to know

- id: spiral-arts
  name: Spiral Arts
  url: https://spiralarts.com
  maker: spiral-arts
  platform: shopify
  crawl:
    - https://spiralarts.com/collections/pipes-and-punties
    - https://spiralarts.com/collections/pipes
    - https://spiralarts.com/collections/the-color-bundle
    - https://spiralarts.com/collections/tools-for-the-hot-shop
    - https://spiralarts.com/collections/often-overlooked-items
  scope:
    in: Blowpipes, punties, color tools, hot-shop hand tools, and bench-sized equipment (yokes, benches, heat shields).
    out: >-
      Large machinery: furnaces, glory holes, annealers, pipe warmers, color boxes, powder
      booths, refractory.

