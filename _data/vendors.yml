  scope:
    in: All of its glassblowing and flameworking hand tools (jacks, tweezers, tagli, crimps).
    out: Gift cards and custom metalwork done by quote.
  notes: >-
    Product descriptions sit inside Divi page-builder markup. The useful text is in each
    product's short description, which the catalog reader already extracts.

