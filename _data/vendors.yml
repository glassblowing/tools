# Every shop the archive links to. A tool's `buy[].vendor` must match a `name` here.
#
#   id        stable slug
#   name      display name, used in buy links
#   url       storefront home page
#   maker     _makers slug when this is the maker selling its own tools (shown as "direct from the maker")
#   platform  shopify | woocommerce | squarespace lets scripts/archive.py read catalogs as JSON;
#             leave it out and the crawl pages are read directly
#   crawl     catalog pages to scan for new in-scope tools; empty means only re-check existing links
#   scope     what to index from this vendor (in / out). Out-of-scope items are skipped, not listed.
#   notes     anything the next update needs to know

- id: spiral-arts
  name: Spiral Arts
  url: https://spiralarts.com
  maker: spiral-arts
  platform: shopify
  crawl:
    - https://spiralarts.com/collections/pipes-and-punties
    - https://spiralarts.com/collections/pipes
    - https://spiralarts.com/collections/the-color-bundle
  scope:
    in: Blowpipes, punties, and color tools (e.g. color bar chopper, threading machine).
    out: >-
      Furnaces, glory holes, annealers, pipe warmers, color boxes, powder booths, benches,
      yokes, heat shields, refractory, and other studio equipment. Revisit later.
  notes: >-
    Its /collections/tools-for-the-hot-shop collection (casting ladle, charging shovel,
    pastorale fork, loading tong, tong covers, pocket inflator) hasn't been requested yet.
    Ask before adding it to crawl.

- id: bc-metalworking
  name: BC Metalworking
  url: https://bcmetalworking.com/
  maker: bc-metalworking
  platform: woocommerce
  crawl:
    - https://bcmetalworking.com/catalog/
  scope:
    in: All of its glassblowing and flameworking hand tools (jacks, tweezers, tagli, crimps).
    out: Gift cards and custom metalwork done by quote.
  notes: >-
    Product descriptions sit inside Divi page-builder markup. The useful text is in each
    product's short description, which the catalog reader already extracts.

- id: watanabe-glass-tools
  name: Watanabe Glass Tools
  url: https://www.glassworkstoolbench.com/watanabeglasstools
  maker: watanabe
  platform: squarespace
  crawl:
    - https://www.glassworkstoolbench.com/watanabeglasstools
  scope:
    in: All of its hand tools (jacks, shears, tweezers, wood tools).
  notes: >-
    Hosted on Glassworks Toolbench (Soda Glass House). Everything is made to order. Some
    listings have photos but no description (Clementine jacks, Square-Back Parchoffis,
    Haystack tweezers), so recheck those for text to use in specs. The Large Italo/German
    Diamond Shears were shown as renderings pending a first production run; update the
    listing once real photos appear.

- id: cutting-edge-products
  name: Cutting Edge Products
  url: https://www.cuttingedgeprdx.com/
  maker: cutting-edge-products
  platform: squarespace
  crawl:
    - https://www.cuttingedgeprdx.com/diamond-shears
    - https://www.cuttingedgeprdx.com/straight-shears
    - https://www.cuttingedgeprdx.com/trim-shears
    - https://www.cuttingedgeprdx.com/shop-pacioffis
    - https://www.cuttingedgeprdx.com/handy-tools
  scope:
    in: Shears, parchoffi, tagliol paddles, and hand tools like the Pi Divider.
    out: >-
      Gift cards, T-shirts, tool wraps, replacement rods, and sharpening or repair
      services. Mention replacement parts on the tool they fit instead.
  notes: >-
    Branded "Red Hot Metal" at distributors. Hot Glass Color & Supply stocks the whole
    line under that name (search its products.json for vendor "Cutting Edge Products").
    Other listed distributors are ABR Imagery (US) and Glass Toolbox Ltd (UK); neither
    is registered yet. The /shop page is only a menu; the crawl pages above are the
    actual store collections (found through /sitemap.xml).

- id: jasen-johnsen
  name: Jasen Johnsen Glass Tools
  url: https://jasenjohnsenglasstools.com/
  maker: jasen-johnsen
  platform: shopify
  crawl:
    - https://jasenjohnsenglasstools.com/collections/jacks
    - https://jasenjohnsenglasstools.com/collections/tweezers
    - https://jasenjohnsenglasstools.com/collections/taglio
    - https://jasenjohnsenglasstools.com/collections/flat-crimps
    - https://jasenjohnsenglasstools.com/collections/textured-crimps
    - https://jasenjohnsenglasstools.com/collections/inside-sculpting-tools
    - https://jasenjohnsenglasstools.com/collections/grabbers
    - https://jasenjohnsenglasstools.com/collections/misc-tools
  scope:
    in: Hand tools (jacks, tweezers, tagli, crimps, sculpting tools, shears, grabbers).
    out: Torch parts and conversions.
  notes: >-
    Bonsai Shears are Japanese-made resale items (out of stock when first indexed), so
    they're skipped. Hot Glass Color sells much of the line as "Jasen Johnsen Handmade
    Tools" under different names; only clear matches are linked. Unmatched HGC items
    (Tweezers Sm 7", Jack Tweezers, Tagliol Square/Round Blade, Flat Crimp Tweezer,
    Wide Flat Masher Lg, V-Angle Crimp Tweezers, Tungsten Pick Tool with Probe) need a
    human to match by size.

- id: maruko-tools
  name: Maruko Tools
  url: https://marukotools.com/
  maker: maruko
  crawl:
    - https://marukotools.com/standard-jacks.html
    - https://marukotools.com/cup-jacks.html
    - https://marukotools.com/goblet-jacks.html
    - https://marukotools.com/tweezers.html
    - https://marukotools.com/productsprice.html
  scope:
    in: All of Maruko's hand tools (jacks, tweezers, pacioffi, taglios, paddles).
    out: Replacement wood sticks for the pacioffi.
  notes: >-
    Weebly site, so read pages directly. productsprice.html ("All Products List") has
    every stock number and spec and is the most reliable page. When first indexed, the
    menu's step-down-tweezers, parcioffi-handles, wooden-paddles, paddle-handles, and
    taglios pages returned 404, so items without a page link to the price list.
    Step-down tweezers were in the menu but not on the price list, so they're skipped.

- id: artco
  name: Artco
  url: https://www.artcoinc.com/
  crawl:
    - https://www.artcoinc.com/maruko_jacks.php
    - https://www.artcoinc.com/maruko_tweezers.php
    - https://www.artcoinc.com/essemce_diamond_shears.php
    - https://www.artcoinc.com/essemce_duckbill_shears.php
    - https://www.artcoinc.com/essemce_ks_shears.php
    - https://www.artcoinc.com/essemce_sh_shears.php
  scope:
    in: Maruko jacks and tweezers, and Essemce shears.
    out: Everything else Artco sells (lampworking tools, torches, books, safety gear) until asked.
  notes: >-
    San Jose, CA retailer with a hand-built PHP site (no store platform), so read the
    crawl pages directly. Each page is one product family with a part-number table; list
    one tool per style and put the sizes in specs. Also has Maruko pacioffi
    (maruko_pacioffi.php) and tagliol (maruko_tagliol.php) pages and a Gott steamer hand
    pad, not yet requested.

