- id: cmog-shops
  name: Shops at the Corning Museum of Glass
  url: https://shops.cmog.org/
  crawl: []
  scope:
    in: Buy links for tools already in the archive (Jim Moore Glass Tools in particular).
  notes: >-
    Sits behind Cloudflare. scripts/archive.py (browser User-Agent) gets real pages, but
    plain curl, WebFetch, and headless Chrome get a 403 challenge. Never remove a link
    just for a 403 here; retry with the script or ask a human to check in a browser.

- id: glass-color
  name: Glass Color
  url: https://glasscolor.com/
  crawl:
    - https://glasscolor.com/tools/hand-tools/jim-moore-tools
  scope:
    in: Buy links for tools already in the archive. Its Jim Moore pages are the best place to find new Jim Moore tools.

- id: tools-for-glass
  name: Tools for Glass
  url: https://www.toolsforglass.com/
  crawl: []
  scope:
    in: Buy links for Jim Moore tools already in the archive.

- id: hot-glass-color
  name: Hot Glass Color & Supply
  url: https://hotglasscolor.com/
  platform: shopify
  crawl:
    - https://hotglasscolor.com/collections/hotshop-tools
    - https://hotglasscolor.com/collections/lampworking-tools
    - https://hotglasscolor.com/collections/torchworking-tools
    - https://hotglasscolor.com/collections/hand-tools
    - https://hotglasscolor.com/collections/wood-tools
    - https://hotglasscolor.com/collections/paddles
    - https://hotglasscolor.com/collections/blocks
    - https://hotglasscolor.com/collections/graphite-tools
    - https://hotglasscolor.com/collections/pipes-punties
    - https://hotglasscolor.com/collections/footing-tools
    - https://hotglasscolor.com/collections/molds-stamps
    - https://hotglasscolor.com/collections/stamps-molds
    - https://hotglasscolor.com/collections/graphite-molds
    - https://hotglasscolor.com/collections/optic-molds
    - https://hotglasscolor.com/collections/marble-molds
    - https://hotglasscolor.com/collections/pineapple-molds
    - https://hotglasscolor.com/collections/brass-stamps
  scope:
    in: >-
      Hand tools (hot shop and flameworking), wood and graphite tools, pipes and punties,
      molds, and stamps, from every maker it carries, including its own house brand.
      One listing per product page; don't merge size variants.
    out: >-
      Torches, small equipment (hoses, regulators, sprayers), glass and color, safety gear,
      books, kilns, consumables, and tool-repair services.
  notes: >-
    A retailer that carries many makers, used to discover tools. Its Shopify "vendor"
    field is the maker (e.g. "Carlo Roberto Dona" is Carlo Donà, "Red Hot Metal" is
    Cutting Edge Products). For house-brand items (vendor "Hot Glass Color & Supply"),
    find the real maker from the title or description and use that. Fall back to the
    hot-glass-color maker only when the page doesn't say. If the tool is already listed
    under its maker, add a buy link instead of a new file.
    Attributions inferred from HGC's own catalog (not stated on the product page): the
    Blast Shield pushes, Facet 4-in-1 mold, TPT ellipse tool, and 4" Vin Pin to Weaver
    Industries (sibling products carry Weaver's name); the Bump Marble Molds to Mike Close.
    Deliberately skipped: torches, casting ladles ("small equipment"; ask before adding),
    tool racks, knock-off pads, newspaper koozie, tong covers and Kevlar sleeves, loading
    sleeves, punty handle add-ons, replacement sticks, heads, wheels, and covers, and
    consumables (wax, etching, bead separator, fume, mold paste, Dip n Go).

