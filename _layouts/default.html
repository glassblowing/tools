<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/brand/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
</head>
<body>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}">glassblowing<span>.tools</span></a>
    <nav>
      <a href="{{ '/tools/' | relative_url }}">Tools</a>
      <a href="{{ '/makers/' | relative_url }}">Makers</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer wrap">
    <p>An independent index. We don't sell anything; prices and stock are up to the seller. Photos belong to the sellers credited on each tool page.</p>
    <p><a href="https://github.com/{{ site.repository }}/issues/new?template=add-tool.yml">Suggest a tool</a> · <a href="https://github.com/{{ site.repository }}">GitHub</a></p>
  </footer>
</body>
</html>
