---
layout: default
---
{%- assign tools = site.tools | where: "category", page.slug | sort: "title" -%}
<p class="crumbs"><a href="{{ '/categories/' | relative_url }}">Categories</a></p>
<h1>{{ page.title }} <span class="count">{{ tools.size }}</span></h1>
<div class="prose muted">{{ content }}</div>
{% if tools.size > 0 %}
{% include tool-table.html tools=tools hide="category" %}
{% else %}
<p class="muted">Nothing listed here yet.</p>
{% endif %}
